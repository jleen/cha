# cha-web plus a Caddy of its own, for a host with no reverse proxy yet.
#
#   1. Edit deploy/Caddyfile: replace cha.example.com with your domain, and
#      change `reverse_proxy 127.0.0.1:8080` to `reverse_proxy cha-web:8080`.
#   2. Point the domain's DNS at this host (Caddy needs to answer on 80/443 to
#      obtain a certificate).
#   3. mkdir -p deploy/dictionaries && cp yourlist.txt deploy/dictionaries/
#   4. docker compose -f deploy/docker-compose.caddy.yml --project-directory deploy up -d
#
# Already running Caddy in Docker for other sites? Don't use this file — it would
# start a second Caddy fighting for ports 80/443. Use
# docker-compose.shared-network.yml instead.

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 is UDP, and Caddy serves it by default. Without this line clients
      # silently fall back to TCP — everything still works, so the omission is
      # easy to miss and easy to misattribute later.
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes, not bind mounts, but do not drop them: caddy_data holds
      # the ACME account key and issued certificates. Losing it on every
      # recreate means re-issuing certs every time, which will hit Let's
      # Encrypt's rate limits and leave the site without a certificate.
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  cha-web:
    image: ghcr.io/jleen/cha-web:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped

    # No `ports:` — Caddy reaches it over the `proxy` network below, so cha-web
    # is unreachable except through the proxy.
    networks:
      - proxy

    volumes:
      - ./dictionaries:/dictionaries:ro

    environment:
      CHA_DICT_DIR: /dictionaries
      RUST_LOG: "cha_web=info,tower_http=warn"

    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G

    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

networks:
  proxy:

volumes:
  caddy_data:
  caddy_config:
