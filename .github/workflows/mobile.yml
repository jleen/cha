name: Mobile

# Separate from release.yml (desktop). Manual runs build-check both platforms and
# upload artifacts; a `mobile-v*` tag additionally attaches the signed Android
# APK + AAB to a GitHub release. iOS here is a build-check only — no signing, no
# secrets, no distribution — so this workflow stays runnable by anyone. Signed
# iOS distribution lives in ios-testflight.yml.
on:
  workflow_dispatch:
  push:
    tags:
      - 'mobile-v*'

env:
  # Keep in sync with the NDK used locally / documented in AGENTS.md.
  NDK_VERSION: '26.1.10909125'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for softprops/action-gh-release on tag runs
    steps:
      # words.txt is committed and freely redistributable, so this checkout
      # alone puts a shippable dictionary where build.rs expects it (repo root).
      # Nothing to materialize — see AGENTS.md, "words.txt in CI".
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: cargo-bins/cargo-binstall@main
      - name: Install Tauri CLI
        run: cargo binstall -y 'tauri-cli@^2'

      # Decode the keystore and write gen/android/keystore.properties (the exact
      # file build.gradle.kts reads). Tauri uses a single `password` for store+key.
      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — the release build would be unsigned and fail to install."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cha-upload.jks"
          cat > cha-gui/src-tauri/gen/android/keystore.properties <<EOF
          password=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=${RUNNER_TEMP}/cha-upload.jks
          EOF

      - name: Build signed APK + AAB
        run: cargo tauri android build --apk --aab

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp cha-gui/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk dist/
          cp cha-gui/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab dist/

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*

      - name: Attach to release (tag runs)
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Cha Mobile ${{ github.ref_name }}
          files: dist/*
          draft: true

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2

      # Build-check only: cross-compile the shared library for iOS (the device
      # target — arch-agnostic, so it works whichever arch the runner is). This
      # catches the breakage that matters, the shared Rust code compiling and
      # linking for iOS, in ~a minute and with no Apple secrets, so it stays
      # useful as a fast sanity check on every manual run. The signed archive +
      # IPA + TestFlight upload is ios-testflight.yml, which is deliberately
      # separate: it needs the distribution cert and profile, and coupling it to
      # this workflow would make every Android run depend on Apple secrets.
      # Runs on macOS because the iOS SDK is Xcode-only.
      - name: Build-check (cross-compile lib for iOS)
        run: cargo build -p cha-gui --lib --target aarch64-apple-ios
